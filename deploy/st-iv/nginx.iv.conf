# Append this block to /opt/stock-coin-trade/docker/nginx.ssl.conf on st.
# The existing frontend container resolves iv-kms-api through its internal Docker network.
server {
    listen 80;
    server_name iv.dumgft.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://iv-kms-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 200s;
    }
}
