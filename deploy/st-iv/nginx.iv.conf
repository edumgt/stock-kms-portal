# Append to /opt/stock-coin-trade/docker/nginx.ssl.conf.
# stock-kms-portal API is available as iv-kms-api on the shared network.
server {
    listen 80;
    server_name iv.edumgt.co.kr;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name iv.edumgt.co.kr;
    ssl_certificate /etc/letsencrypt/live/st.edumgt.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/st.edumgt.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://iv-kms-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 200s;
    }
}
