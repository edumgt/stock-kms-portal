name: stock-kms-portal

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - ../../.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../init.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      default:
        aliases:
          - kms-postgres

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      default:
        aliases:
          - kms-redis

  qdrant:
    image: qdrant/qdrant:v1.15.1
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      default:
        aliases:
          - kms-qdrant

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: stock-kms-portal-api:iv
    env_file:
      - ../../.env.prod
    environment:
      POSTGRES_HOST: kms-postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: kms-redis
      REDIS_PORT: 6379
      QDRANT_HOST: kms-qdrant
      QDRANT_PORT: 6333
      VLLM_MODEL: qwen2.5:7b
      LLM_TRANSPORT: ssh
      LLM_TIMEOUT_SECONDS: 600
      LEAN_RUNNER: remote
      LEAN_SSH_HOST: 43.201.229.188
      LEAN_SSH_USER: lean-iv
      LEAN_SSH_KEY_PATH: /run/secrets/lean-runner.key
      LEAN_REMOTE_WORKDIR: /home/lean-iv/workflows
      LEAN_DOCKER_IMAGE: quantconnect/lean:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_uploads:/app/data/uploads
      - ../../secrets/lean-runner.key:/run/secrets/lean-runner.key:ro
    networks:
      default: {}
      st_proxy:
        aliases:
          - iv-kms-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

networks:
  default: {}
  st_proxy:
    external: true
    name: stock-coin-trade_internal

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  app_uploads:
