# 로컬(PC) 인덱싱용 Qdrant — 서버(st stock-kms-portal-qdrant-1)와 같은 버전으로 맞춰 스냅샷 호환을 보장한다.
#   docker compose -p kms-rag -f rag/compose.yml up -d
#   rag/.venv/bin/python rag/indexer.py            # 문서 → 임베딩 → 로컬 Qdrant
#   bash rag/export_snapshot.sh                     # 스냅샷 파일 → rag/snapshots/
services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - kms_rag_qdrant:/qdrant/storage
      - kms_rag_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  kms_rag_qdrant:
  kms_rag_snapshots:
